
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Auction Platform</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Auction Platform</a>
            <span id="connection-status" class="text-warning">
                Disconnected
            </span>
        </div>
    </nav>

    <main class="container my-4">
        <!-- Create listing -->
        <section class="card mb-4">
            <div class="card-header">
                <h2 class="h5 mb-0">Create an Auction</h2>
            </div>

            <div class="card-body">
                <form id="listing-form">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input
                            type="text"
                            class="form-control"
                            id="title"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Description
                        </label>
                        <textarea
                            class="form-control"
                            id="description"
                            rows="3"
                            required
                        ></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="starting-price" class="form-label">
                            Starting price
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="starting-price"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="start-option" class="form-label">
                            Auction start
                        </label>
                        <select class="form-select" id="start-option">
                            <option value="now">Start now</option>
                            <option value="scheduled">Schedule for later</option>
                        </select>
                    </div>

                    <div class="mb-3" id="scheduled-time-group" hidden>
                        <label for="start-time" class="form-label">
                            Start date and time
                        </label>
                        <input
                            type="datetime-local"
                            class="form-control"
                            id="start-time"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="duration" class="form-label">
                            Duration (minutes)
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="duration"
                            min="1"
                            value="60"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="strategy" class="form-label">
                            Bidding strategy
                        </label>
                        <select class="form-select" id="strategy">
                            <option value="STRICT_INCREMENT">
                                Strict Increment
                            </option>
                            <option value="FLAT_RATE">
                                Flat Rate
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="step-value" class="form-label">
                            Increment value
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="step-value"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Create Listing
                    </button>
                </form>
            </div>
        </section>

        <!-- Auction catalog -->
        <section>
            <h2 class="h4 mb-3">Auction Catalog</h2>

            <h3 class="h5">Live Auctions</h3>
            <div id="live-auctions" class="row g-3 mb-4">
                <!-- Live auction cards will be inserted here -->
            </div>

            <h3 class="h5">Scheduled Auctions</h3>
            <div id="scheduled-auctions" class="row g-3">
                <!-- Scheduled auction cards will be inserted here -->
            </div>
        </section>
    </main>

    <!-- Notification toasts -->
    <div
        id="notification-container"
        class="toast-container position-fixed bottom-0 end-0 p-3"
    ></div>

    <script src="app.js"></script>
</body>
</html>
